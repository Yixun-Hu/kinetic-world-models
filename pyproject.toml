[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kwm"
version = "0.1.0"
description = "Kinetic world models (fork; editable install for the kinetic 3D benchmark)"
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[tool.setuptools]
packages = ["kwm"]
